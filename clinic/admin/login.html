<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — M.V. Masangkay Clinic</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/admin.css"/>
</head>
<body>

<div class="admin-login-bg">
  <div class="login-card">

    <div class="login-logo">
      <div class="login-logo-icon">
        <svg width="22" height="22" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24">
          <path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0H5m14 0h2M5 21H3M9 7h1m-1 4h1m4-4h1m-1 4h1M9 21v-3.5a.5.5 0 01.5-.5h5a.5.5 0 01.5.5V21"/>
        </svg> 
      </div>
      <div>
        <div class="login-clinic-name">M.V. Masangkay X-Ray &amp; Laboratory Clinic</div>
        <div class="login-clinic-sub">General Malvar Ave, Santo Tomas, Batangas</div>
      </div>
    </div>

    <div class="login-badge">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Admin Access Only
    </div>

    <h2>Sign in to Control Panel</h2>
    <p>Authorized clinic staff only. Unauthorized access is prohibited.</p>

    <div id="login-error" style="display:none;background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:12px 16px;font-size:13px;color:#dc2626;margin-bottom:16px;display:none;align-items:center;gap:8px;">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
      <span id="login-error-msg">Invalid credentials.</span>
    </div>

    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" class="form-control" id="admin-user" placeholder="admin" autocomplete="username"/>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-password-wrap">
        <input type="password" class="form-control" id="admin-pass" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') adminLogin()"/>
        <button type="button" class="password-toggle" onclick="togglePw(this)" aria-label="Toggle password">
          <svg id="pw-eye" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn btn-primary btn-block" id="login-btn" onclick="adminLogin()">
      Sign in
    </button>
    <p class="login-back">Not an admin? <a href="../index.html">Book an appointment here</a></p>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
  function togglePw(btn) {
    const input = document.getElementById('admin-pass');
    const eye = document.getElementById('pw-eye');
    if (input.type === 'password') {
      input.type = 'text';
      eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"/>';
    } else {
      input.type = 'password';
      eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  function showToast(msg, type) {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = 'toast' + (type ? ' ' + type : '');
    t.innerHTML = `<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><span>${msg}</span>`;
    c.appendChild(t);
    setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),320); }, 3000);
  }

  function adminLogin() {
    const u = document.getElementById('admin-user').value.trim();
    const p = document.getElementById('admin-pass').value;
    const btn = document.getElementById('login-btn');
    const errBox = document.getElementById('login-error');
    const errMsg = document.getElementById('login-error-msg');

    if (!u || !p) {
      errMsg.textContent = 'Please enter both username and password.';
      errBox.style.display = 'flex';
      return;
    }

    btn.textContent = 'Signing in…';
    btn.disabled = true;
    errBox.style.display = 'none';

    // Simulate async login
    setTimeout(() => {
      if (u === 'admin' && p === 'admin123') {
        // Store session flag
        sessionStorage.setItem('admin_logged_in', '1');
        sessionStorage.setItem('admin_user', u);
        showToast('Login successful! Redirecting…', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      } else {
        errMsg.textContent = 'Invalid username or password. Try admin / admin123';
        errBox.style.display = 'flex';
        btn.textContent = 'Sign in to Dashboard';
        btn.disabled = false;
        document.getElementById('admin-pass').value = '';
        document.getElementById('admin-pass').focus();
      }
    }, 700);
  }

  // If already logged in, redirect
  if (sessionStorage.getItem('admin_logged_in') === '1') {
    window.location.href = 'dashboard.html';
  }
</script>
</body>
</html>
